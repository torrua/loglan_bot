    <title>{% if self.title() %}{% block title %}{% endblock %} - {% endif %}Loglan Online</title>
  </head>

  <style>
    :root {
      --site-bg: #fdfdfd;
      --text-main: #2b3035;
      --text-muted: #6c757d;
      --border-color: #e9ecef;
      --nav-active: #1a1e21;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text-main);
      background-color: var(--site-bg);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      line-height: 1.6;
    }
    .header {
      text-align: center;
      padding-top: 1.5rem;
      padding-bottom: 0.5rem;
    }
    .header h1 {
      font-family: 'Georgia', serif;
      font-size: 2.25rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: #1e293b;
    }
    .site-nav {
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      background-color: #fafafa;
    }
    .site-nav .nav-link {
      font-size: 0.95rem;
      color: #4b5563;
      padding: 0.6rem 1rem;
      font-weight: 500;
    }
    .site-nav .nav-link:hover, .site-nav .nav-link:focus {
      color: #0f172a;
    }
    .content {
      flex: 1 0 auto;
    }
    .footer {
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      padding: 1.25rem 0;
      background-color: #fafafa;
      text-align: center;
    }
    .footer a {
      color: #475569;
      text-decoration: underline;
    }

    {% block style %}{% endblock %}
  </style>

  <body>
    <header class="header">
      <h1>Loglan Online</h1>
    </header>

    <nav class="navbar navbar-expand-sm navbar-light site-nav justify-content-center">
      <div class="container-fluid justify-content-center">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup"
                aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-center" id="navbarNavAltMarkup">
          <div class="navbar-nav">
            <a class="nav-link" href="{{url_for('site.home')}}">Home</a>
            <a class="nav-link" href="{{url_for('site.dictionary')}}">Dictionary</a>
            <a class="nav-link" href="{{url_for('site.articles')}}">Articles</a>
            <a class="nav-link" href="{{url_for('site.texts')}}">Texts</a>
            <a class="nav-link" href="{{url_for('site.columns')}}">Columns</a>
            <a class="nav-link" href="/site/Loglan1/">Loglan 1</a>
          </div>
        </div>
      </div>
    </nav>

    <main class="content">
      {% block content %}{% endblock %}
    </main>

    <footer class="footer">
      <div class="container">
        Copyright © <script type="text/javascript">var year = new Date();document.write(year.getFullYear());</script> <a href="http://www.loglan.org/">The Loglan Institute</a> & <a href="https://github.com/torrua">torrua</a>. All rights reserved.
      </div>
    </footer>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-gtEjrD/SeCtmISkJkNUaaKMoLD0//ElJ19smozuHV6z3Iehds+3Ulb9Bn9Plx0x4" crossorigin="anonymous"></script>
  </body>
</html>
