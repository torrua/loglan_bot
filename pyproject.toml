[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loglan-bot"
version = "0.2.0"
description = "Loglan Dictionary Telegram Bot and Web Service"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "torrua" },
]
dependencies = [
    "Quart>=0.23.1",
    "Hypercorn>=0.18.0",
    "quart-cors>=0.8.0",
    "SQLAlchemy[asyncio]>=2.1.2",
    "asyncpg>=0.30.0",
    "Loglan-Core>=0.5.0",
    "pyTelegramBotAPI>=4.37.0",
    "callbaker>=1.4.0",
    "keyboa>=3.1.0",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "aiohttp>=3.12.0",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=2.4.0",
    "ruff>=0.16.10",
    "aiosqlite>=0.20.0",
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "callbaker.*",
    "keyboa.*",
    "loglan_core.*",
    "telebot.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "UP007", # Use `X | Y` for type annotations
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
